# =============================================================================
#  POC Agent IA Échecs - FFE
#  Orchestration des services. À l'étape 1, seul "backend" est indispensable.
#  MongoDB et Milvus sont déjà déclarés pour les étapes suivantes (RAG, persistance).
#  Le service "frontend" (Angular) sera ajouté à l'étape 5.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # API FastAPI (cœur de l'agent)
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: ffe_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/code/app   # hot-reload du code en développement
    depends_on:
      - mongo
    networks:
      - ffe_net

  # ---------------------------------------------------------------------------
  # Frontend Angular (échiquier interactif + panneau de recommandations)
  #   Build multi-stage -> servi par nginx, qui proxifie /api vers le backend.
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: ffe_frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - ffe_net

  # ---------------------------------------------------------------------------
  # MongoDB (métadonnées : parties, vidéos, historique...)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: ffe_mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db       # volume persistant
    networks:
      - ffe_net

  # ---------------------------------------------------------------------------
  # Milvus standalone (recherche vectorielle du RAG) + ses dépendances etcd/minio
  #  -> Peut être commenté à l'étape 1 pour un démarrage plus léger.
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ffe_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - ffe_net

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: ffe_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    networks:
      - ffe_net

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ffe_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - ffe_net

# -----------------------------------------------------------------------------
# Volumes persistants (survivent à `docker compose down`, effacés par `down -v`)
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  ffe_net:
    driver: bridge
